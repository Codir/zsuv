name: Godot build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "media/**", "tools/**", ".claude/**"]
  pull_request:
    paths-ignore: ["**.md", "media/**", "tools/**", ".claude/**"]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

# A tagged release does not pass builds between jobs through artifacts: artifact storage has a hard
# quota, and a full quota can block a deploy. Each export job pushes its own itch.io channel and
# attaches its own file to the GitHub Release, which the test job creates first.
# Branch and PR runs keep only the Web zip, for 3 days, and never fail on a full quota.
jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v7

      - name: Import project
        run: godot --headless --path . --import

      # Capture the status rather than let `bash -e` end the step before the log is printed.
      - name: Parse every script, compile every shader
        run: |
          rc=0; out=$(godot --headless --path . -s res://tests/check.gd 2>&1) || rc=$?
          echo "$out"
          [ "$rc" -eq 0 ] && ! echo "$out" | grep -q "SCRIPT ERROR\|SHADER ERROR\|Parse Error\|Failed to load"

      # The runner fails a test on any error the engine logs; the grep is a second net.
      - name: Run tests
        run: |
          rc=0; out=$(timeout 600 godot --headless --fixed-fps 60 --path . -s res://tests/run_tests.gd 2>&1) || rc=$?
          echo "$out"
          [ "$rc" -eq 0 ] && ! echo "$out" | grep -q "SCRIPT ERROR\|SHADER ERROR"

      - name: Create the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

  build:
    name: Build ${{ matrix.preset }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: barichello/godot-ci:4.7.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Web
            out: builds/web/index.html
            artifact: builds/web
            channel: html5
            asset: ""
          - preset: Windows
            out: builds/windows/KhutirRoad.exe
            artifact: builds/windows
            channel: windows
            asset: windows.exe
          - preset: Linux
            out: builds/linux/KhutirRoad.x86_64
            artifact: builds/linux
            channel: linux
            asset: linux.x86_64
          - preset: macOS
            out: builds/macos/KhutirRoad.zip
            artifact: builds/macos
            channel: mac
            asset: macos.zip
    steps:
      - uses: actions/checkout@v7

      - name: Set up export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import project
        run: godot --headless --path . --import

      - name: Export ${{ matrix.preset }}
        id: export
        run: |
          mkdir -p "$(dirname '${{ matrix.out }}')"
          godot --headless --path . --export-release "${{ matrix.preset }}" "${{ matrix.out }}"
          ls -la "$(dirname '${{ matrix.out }}')"
          test -s "${{ matrix.out }}"

      - name: Package Web build
        if: matrix.preset == 'Web'
        run: cd builds/web && zip -r ../KhutirRoad-web.zip .

      - name: Upload Web zip
        if: matrix.preset == 'Web' && !startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: KhutirRoad-web-zip
          path: builds/KhutirRoad-web.zip
          retention-days: 3

      # Every build goes to its own itch.io channel; Windows, Linux and macOS also go to the GitHub Release.
      # The two deliveries only need the export, not each other: an itch.io outage does not hold back the
      # GitHub file, and the other way round. A transient failure: "Re-run failed jobs" on the same tag.
      - name: Push to itch.io (${{ matrix.channel }})
        if: ${{ !cancelled() && steps.export.outcome == 'success' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET || 'codirs/psxrunner' }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then echo "::error::BUTLER_API_KEY secret is not set"; exit 1; fi
          if [ -z "$ITCH_TARGET" ]; then echo "::error::ITCH_TARGET repository variable (user/game) is not set"; exit 1; fi
          BUTLER="$(command -v butler || true)"
          if [ -z "$BUTLER" ]; then
            wget -nv -O /tmp/butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
            unzip -q -o /tmp/butler.zip -d /tmp/butler
            chmod +x /tmp/butler/butler
            BUTLER=/tmp/butler/butler
          fi
          "$BUTLER" -V
          "$BUTLER" push "${GITHUB_WORKSPACE}/${{ matrix.artifact }}" "$ITCH_TARGET:${{ matrix.channel }}" --userversion "${GITHUB_REF_NAME#v}"

      - name: Prepare release file
        id: release_file
        if: ${{ !cancelled() && steps.export.outcome == 'success' && startsWith(github.ref, 'refs/tags/v') && matrix.asset != '' }}
        run: |
          mkdir -p out
          cp "${{ matrix.out }}" "out/KhutirRoad-${GITHUB_REF_NAME}-${{ matrix.asset }}"
          ls -la out

      - name: Attach to the GitHub Release
        if: ${{ !cancelled() && steps.release_file.outcome == 'success' }}
        uses: softprops/action-gh-release@v3
        with:
          files: out/*
